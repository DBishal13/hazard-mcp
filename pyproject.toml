[project]
name = "hazard-mcp"
version = "0.1.0"
description = "Unified multi-hazard disaster-intelligence MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<2",  # 2.x renamed FastMCP -> MCPServer
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "folium>=0.17",
    "uvicorn>=0.30",
]

[project.scripts]
hazard-mcp = "hazard_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hazard_mcp = ["static/*"]
